name: QuickSwitch

options:
  bundleIdPrefix: com.willmonk
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  QuickSwitch:
    type: application
    platform: macOS
    sources:
      - path: QuickSwitch
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willmonk.QuickSwitch
        PRODUCT_NAME: QuickSwitch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QuickSwitch/Info.plist
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies: []

  QuickSwitchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: QuickSwitchTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.willmonk.QuickSwitchTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QuickSwitch

schemes:
  QuickSwitch:
    build:
      targets:
        QuickSwitch: all
        QuickSwitchTests: [test]
    test:
      targets:
        - QuickSwitchTests
