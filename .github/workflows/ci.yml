name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run tests
        run: |
          xcodebuild test \
            -project QuickSwitch.xcodeproj \
            -scheme QuickSwitch \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/QuickSwitchDerivedData"
